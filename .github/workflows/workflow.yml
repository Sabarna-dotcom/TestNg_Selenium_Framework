  name: Test Automation Workflow

  on:
    workflow_dispatch:
      inputs:
        browser:
          description: 'Browser to execute tests'
          required: true
          type: choice
          options:
            - chrome
            - firefox
            - edge
          default: chrome

        isLambdaTest:
          description: 'Run tests on LambdaTest?'
          required: true
          type: boolean
          default: true

        isHeadless:
          description: 'Run browser in headless mode?'
          required: true
          type: boolean
          default: false

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven

        - name: Run Test Automation Framework with Maven
          run: >
            mvn test
            -Dbrowser=${{ inputs.browser }}
            -DisLambdaTest=${{ inputs.isLambdaTest }}
            -DisHeadless=${{ inputs.isHeadless }}

        - name: Upload Test Logs
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-logs
            path: logs/
            if-no-files-found: warn

        - name: Upload Screenshots as Artifacts
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: screenshots
            path: screenshots/
            if-no-files-found: warn

        - name: Upload HTML Report as Artifact
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: html-report
            path: report.html
            if-no-files-found: warn

        - name: Test Execution Status
          if: always()
          run: echo "Test Execution Completed"